spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: happypath-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/happypath}
    username: ${SPRING_DATASOURCE_USERNAME:happypath_user}
    password: ${SPRING_DATASOURCE_PASSWORD:happypath_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # FIX: use 'none' — NOT 'validate'.
      #
      # With 'validate', Hibernate checks that entity mappings match the current
      # DB schema at boot time. The problem: Hibernate validation runs BEFORE
      # Flyway migrations, so on a fresh DB (empty schema) it crashes trying to
      # resolve entity metadata, which in turn prevents JPA repositories from
      # being created (UnsatisfiedDependencyException on EntityManagerFactory).
      #
      # With 'none', Hibernate makes zero schema changes and zero validation.
      # Flyway is the sole owner of the schema and always runs first via
      # Spring Boot's FlywayMigrationInitializer — by the time Hibernate's
      # EntityManagerFactory needs the tables, they already exist.
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minuti default
      cache-null-values: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    user:
      name: ${ACTUATOR_USER:actuator}
      password: ${ACTUATOR_PASSWORD:change-me-in-production}
      roles: ACTUATOR

springdoc:
  swagger-ui:
    operationsSorter: method
  api-docs:
    path: "/v3/api-docs"

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator

server:
  port: 8080
  servlet:
    context-path: "/api"

logging:
  level:
    root: WARN
    com.happypath: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

happypath:
  jwt:
    secret: ${HAPPYPATH_JWT_SECRET:happypath-super-secret-key-change-in-production-must-be-256-bits-long}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${HAPPYPATH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:happypath-media}
