spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: happypath-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/happypath
    username: happypath_user
    password: happypath_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # FIX: schema is managed exclusively by Flyway.
      # 'validate' makes Hibernate verify entities match the DB schema but
      # makes NO structural changes — preventing conflicts with Flyway migrations.
      ddl-auto: validate
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minuti default
      cache-null-values: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

  # Actuator HTTP Basic credentials.
  # Override ALL of these via environment variables in production.
  security:
    user:
      name: ${ACTUATOR_USER:actuator}
      password: ${ACTUATOR_PASSWORD:change-me-in-production}
      roles: ACTUATOR

springdoc:
  swagger-ui:
    operationsSorter: method
  api-docs:
    path: "/v3/api-docs"

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        # Expose health (public liveness probe), info, metrics.
        # /actuator/** is protected by SecurityConfig.actuatorFilterChain (ROLE_ACTUATOR).
        include: health,info,metrics
      base-path: /actuator

server:
  port: 8080
  servlet:
    context-path: "/api"

logging:
  level:
    root: WARN
    com.happypath: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

happypath:
  jwt:
    secret: ${HAPPYPATH_JWT_SECRET:happypath-super-secret-key-change-in-production-must-be-256-bits-long}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${HAPPYPATH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MinIO / S3-compatible storage
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:happypath-media}
