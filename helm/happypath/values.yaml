# ==============================================================
# HappyPath — Helm values (GKE)
# Personalizza questi valori prima del deploy in produzione.
# ==============================================================

global:
  # Nome del progetto GCP e region (usati per Cloud SQL, GCS, ecc.)
  gcpProject: "my-gcp-project"
  gcpRegion: "europe-west1"

# ---------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: europe-west1-docker.pkg.dev/my-gcp-project/happypath/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  env:
    # Le credenziali sensibili sono lette dai Secret (vedi templates/secrets.yaml)
    SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/happypath"
    SPRING_DATA_REDIS_PORT: "6379"
    MINIO_BUCKET: "happypath-media"
    # CORS: inserisci il dominio reale del frontend
    HAPPYPATH_CORS_ALLOWED_ORIGINS: "https://happypath.example.com"
  # Abilita Cloud SQL Auth Proxy come sidecar
  cloudSqlProxy:
    enabled: true
    # Esempio: my-gcp-project:europe-west1:happypath-pg
    instanceConnectionName: "my-gcp-project:europe-west1:happypath-pg"
    image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------
# Frontend (React/Nginx)
# ---------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: europe-west1-docker.pkg.dev/my-gcp-project/happypath/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------
# Redis (Memorystore o pod interno)
# Per produzione GKE usa Memorystore e imposta useExternal: true
# ---------------------------------------------------------------
redis:
  useExternal: false          # true = punta a Memorystore
  externalHost: ""            # es. 10.0.0.3 (IP Memorystore)
  # Deploy interno (solo se useExternal: false)
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  persistence:
    enabled: true
    storageClass: "standard-rwo"
    size: 2Gi

# ---------------------------------------------------------------
# MinIO — solo per ambienti non-prod.
# In produzione usa Google Cloud Storage + HMAC keys.
# ---------------------------------------------------------------
minio:
  enabled: true               # false = usa GCS in produzione
  image:
    repository: minio/minio
    tag: "latest"
  service:
    apiPort: 9000
    consolePort: 9001
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    storageClass: "standard-rwo"
    size: 10Gi

# ---------------------------------------------------------------
# Ingress (GKE Ingress → Google Cloud Load Balancer)
# ---------------------------------------------------------------
ingress:
  enabled: true
  className: "gce"            # oppure "nginx" se usi NGINX Ingress Controller
  host: "happypath.example.com"
  # ARN/name del managed certificate (creato separatamente)
  tlsManagedCertName: "happypath-managed-cert"
  staticIpName: "happypath-static-ip"

# ---------------------------------------------------------------
# Service Account GKE (Workload Identity)
# ---------------------------------------------------------------
serviceAccount:
  create: true
  name: "happypath-sa"
  # KSA annotata con il GSA per Workload Identity
  gcpServiceAccount: "happypath-ksa@my-gcp-project.iam.gserviceaccount.com"
