# ==============================================================
# HappyPath — Helm values (BASE)
# Valori condivisi tra tutti gli ambienti.
# Sovrascrivi con values-gke.yaml o values-oci.yaml.
# ==============================================================

# ---------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: ""   # OBBLIGATORIO: sovrascrivi nel values specifico per cloud
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://happypath-postgres:5432/happypath"
    SPRING_DATA_REDIS_PORT: "6379"
    MINIO_BUCKET: "happypath-media"
    HAPPYPATH_CORS_ALLOWED_ORIGINS: "https://happypath.example.com"
  # Sidecar Cloud SQL Auth Proxy — solo GKE. Disabilitato di default.
  cloudSqlProxy:
    enabled: false
    instanceConnectionName: ""
    image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------
# Frontend (React/Nginx)
# ---------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: ""   # OBBLIGATORIO: sovrascrivi nel values specifico per cloud
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------
# PostgreSQL interno (usato quando non c'è un DB managed esterno)
# ---------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  service:
    port: 5432
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    storageClass: ""   # sovrascritto dal values cloud-specifico
    size: 10Gi

# ---------------------------------------------------------------
# Redis
# ---------------------------------------------------------------
redis:
  useExternal: false
  externalHost: ""
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  persistence:
    enabled: true
    storageClass: ""   # sovrascritto dal values cloud-specifico
    size: 2Gi

# ---------------------------------------------------------------
# MinIO
# ---------------------------------------------------------------
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "latest"
  service:
    apiPort: 9000
    consolePort: 9001
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    storageClass: ""   # sovrascritto dal values cloud-specifico
    size: 20Gi

# ---------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"   # default NGINX; GKE sovrascrive con "gce"
  host: "happypath.example.com"
  tls:
    enabled: false     # abilitato nel values cloud-specifico
    secretName: "happypath-tls"
  # Annotazioni GKE-specific (ignorate su OCI)
  gke:
    enabled: false
    tlsManagedCertName: "happypath-managed-cert"
    staticIpName: "happypath-static-ip"

# ---------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------
serviceAccount:
  create: true
  name: "happypath-sa"
  annotations: {}
