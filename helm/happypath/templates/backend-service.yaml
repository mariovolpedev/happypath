apiVersion: v1
kind: Service
metadata:
  name: {{ include "happypath.fullname" . }}-backend
  labels:
    {{- include "happypath.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "happypath.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
