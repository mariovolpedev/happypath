# ==============================================================
# ATTENZIONE: questo file crea uno stub di Secret Kubernetes.
# I valori base64 DEVONO essere popolati prima del deploy tramite:
#   - External Secrets Operator (consigliato in prod)
#   - kubectl create secret (vedi DEPLOY_GUIDE.md)
#   - Google Secret Manager + ESO
# NON committare mai valori reali in questo file.
# ==============================================================
apiVersion: v1
kind: Secret
metadata:
  name: happypath-secrets
  labels:
    {{- include "happypath.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ------ Database (Cloud SQL) --------------------------------
  DB_USERNAME: "CHANGE_ME"          # utente PostgreSQL
  DB_PASSWORD: "CHANGE_ME"          # password PostgreSQL

  # ------ JWT -------------------------------------------------
  JWT_SECRET: "CHANGE_ME_256_BIT_BASE64_STRING"

  # ------ MinIO / GCS -----------------------------------------
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"

  # ------ Actuator Basic Auth ---------------------------------
  ACTUATOR_USER: "actuator"
  ACTUATOR_PASSWORD: "CHANGE_ME"

  # ------ Redis (se Memorystore con AUTH abilitato) -----------
  REDIS_PASSWORD: ""                # lascia vuoto se AUTH non abilitato
