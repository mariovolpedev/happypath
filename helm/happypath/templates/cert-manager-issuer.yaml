{{- if and .Values.ingress.tls.enabled (not .Values.ingress.gke.enabled) }}
# ClusterIssuer Let's Encrypt — usato su OCI e ambienti non-GKE
# Richiede cert-manager installato nel cluster (vedi DEPLOY_GUIDE_OCI.md)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    {{- include "happypath.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@happypath.example.com   # <-- sostituisci con email reale
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}
