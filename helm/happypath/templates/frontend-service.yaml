apiVersion: v1
kind: Service
metadata:
  name: {{ include "happypath.fullname" . }}-frontend
  labels:
    {{- include "happypath.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "happypath.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
